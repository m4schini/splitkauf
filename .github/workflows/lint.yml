name: Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      # Generate embeds a placeholder ports/web/dist so the //go:embed in
      # ports/web compiles; the Go-compiling lint/vuln steps below need it.
      - name: Generate
        run: make generate

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Check go.mod/go.sum tidiness
        run: make tidy-check

      - name: Vulnerability scan
        run: make security

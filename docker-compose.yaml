# Shared database connection env, reused by the app and the one-shot migrate job.
x-database-env: &database-env
  SPLITKAUF_DATABASE_HOST: postgres
  SPLITKAUF_DATABASE_PORT: "5432"
  SPLITKAUF_DATABASE_USER: splitkauf
  SPLITKAUF_DATABASE_PASSWORD: splitkauf
  SPLITKAUF_DATABASE_NAME: splitkauf
  SPLITKAUF_DATABASE_SSL_MODE: disable

services:
  # One-shot schema migration: applies embedded migrations, then exits.
  migrate:
    build:
      context: .
    image: splitkauf:local
    command: ["migrate"]
    environment:
      <<: *database-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: splitkauf:local
    command: ["serve"]
    environment:
      <<: *database-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: splitkauf
      POSTGRES_USER: splitkauf
      POSTGRES_PASSWORD: splitkauf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitkauf -d splitkauf"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

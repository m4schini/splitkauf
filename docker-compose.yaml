services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: splitkauf
      POSTGRES_USER: splitkauf
      POSTGRES_PASSWORD: splitkauf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitkauf -d splitkauf"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
